  <script type="module">
    const READING_ENDPOINT = "https://goodreads-proxy.satram-rohan.workers.dev";

    function showStatus(container, text) {
      const span = document.createElement("span");
      span.style.color = "var(--muted-color)";
      span.textContent = text;
      container.replaceChildren(span);
    }

    function renderBook(item) {
      const text = (tag) => item.querySelector(tag)?.textContent?.trim() ?? "";

      const wrapper = document.createElement("div");
      wrapper.style.marginBottom = "0.5rem";

      const title = document.createElement("div");
      title.className = "book-title";
      title.textContent = text("title");
      wrapper.append(title);

      const author = text("author_name");
      if (author) {
        const byline = document.createElement("div");
        byline.className = "book-author";
        byline.textContent = `by ${author}`;
        wrapper.append(byline);
      }

      return wrapper;
    }

    async function loadCurrentlyReadingBook() {
      const container = document.getElementById("goodreads-container");

      try {
        const response = await fetch(READING_ENDPOINT);
        if (!response.ok) throw new Error(`proxy responded ${response.status}`);

        const xml = await response.text();
        const doc = new DOMParser().parseFromString(xml, "application/xml");

        if (doc.querySelector("parsererror")) throw new Error("invalid XML");

        const books = Array.from(doc.querySelectorAll("item"));
        if (books.length === 0) {
          showStatus(container, "none currently");
          return;
        }

        container.replaceChildren(...books.map(renderBook));
      } catch (error) {
        console.error("currently reading:", error);
        showStatus(container, "unable to load book");
      }
    }

    loadCurrentlyReadingBook();
  </script>
